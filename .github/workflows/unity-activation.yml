name: Unity - Gerar arquivo de ativação

on:
  workflow_dispatch:

jobs:
  activation:
    name: Solicitar ativação Unity
    runs-on: ubuntu-latest

    steps:
      - name: Gerar instruções de ativação
        id: activation
        run: |
          cat <<'EOF' > unity-activation-instructions.txt
          A ação `game-ci/unity-request-activation-file` foi descontinuada e não funciona mais.

          Para ativar o Unity com GameCI:
          1. Gere a licença localmente pelo Unity Hub (arquivo `.ulf`).
          2. Cadastre os segredos no repositório:
             - UNITY_LICENSE
             - UNITY_EMAIL
             - UNITY_PASSWORD

          Documentação oficial:
          https://game.ci/docs/github/activation
          EOF

      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-instructions
          path: unity-activation-instructions.txt
